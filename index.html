<!DOCTYPE html>
<html>
<head>
<title>GamesHill Weather Station</title>
<style>
body { font-family: sans-serif; text-align: center; background: #f0f4f8; padding: 40px; }
.box { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
h1 { color: #333; }
.stat { font-size: 24px; margin: 15px 0; color: #0066cc; }
</style>
</head>
<body>

<div class="box">
<h1>🏡 GamesHill Weather Station</h1>
<div class="stat">🌡️ Temperature: <span id="temp">Loading...</span>°C</div>
<div class="stat">💨 Wind Speed: <span id="wind">Loading...</span> km/h</div>
<div class="stat">💧 Humidity: <span id="humidity">Loading...</span>%</div>
</div>

<script>
// Paste your details inside the quotes below:
const stationId = "IKILMA132";
const apiKey = "b65d463044b340a89d463044b380a821";

// FIXED: Corrected the full API endpoint URL structure for Weather Underground PWS
const url = `https://weather.com{stationId}&format=json&units=m&apiKey=${apiKey}`;

function loadWeather() {
fetch(url)
.then(res => {
    if (!res.ok) throw new Error('Network response error');
    return res.json();
})
.then(data => {
    // Weather Underground stores the current data payload inside the first element of the observations array
    const obs = data.observations[0].metric;
    const humidity = data.observations[0].humidity;

    document.getElementById('temp').innerText = obs.temp.toFixed(1);
    document.getElementById('wind').innerText = Math.round(obs.windSpeed);
    document.getElementById('humidity').innerText = Math.round(humidity);
})
.catch(err => {
    console.error("Error fetching weather data:", err);
    document.getElementById('temp').innerText = "Error";
    document.getElementById('wind').innerText = "Error";
    document.getElementById('humidity').innerText = "Error";
});
}

loadWeather(); // Load immediately
setInterval(loadWeather, 300000); // Refresh every 5 minutes
</script>

</body>
</html>
