<!DOCTYPE html>
<html>
<head>
<title>GamesHill Weather Station</title>
<style>
body { font-family: sans-serif; text-align: center; background: #1c1c1e; padding: 40px; color: #ffffff; }
.box { background: #2c2c2e; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 1px solid #3a3a3c; }
h1 { color: #ffffff; font-size: 28px; margin-bottom: 25px; }
.stat { font-size: 24px; margin: 15px 0; color: #ffffff; text-align: left; display: flex; align-items: center; justify-content: center; }
.stat-label { margin-left: 10px; }
</style>
</head>
<body>

<div class="box">
<h1>🏡 GamesHill Weather Station</h1>
<div class="stat"><span>🌡️</span><span class="stat-label">Temperature: <span id="temp">Loading...</span>°C</span></div>
<div class="stat"><span>💨</span><span class="stat-label">Wind Speed: <span id="wind">Loading...</span> km/h</span></div>
<div class="stat"><span>💧</span><span class="stat-label">Humidity: <span id="humidity">Loading...</span>%</span></div>
</div>

<script>
// Replace these with your actual details inside the quotes:
const stationId = "IKILMA132";
const apiKey = "b65d463044b340a89d463044b380a821";

const url = `https://weather.com{stationId}&format=json&units=m&apiKey=${apiKey}`;

function loadWeather() {
fetch(url)
.then(res => {
    if (!res.ok) throw new Error('Network response error');
    return res.json();
})
.then(data => {
    // FIXED: Correctly accessing the first item [0] inside the observations array
    const obs = data.observations[0].metric;
    const humidity = data.observations[0].humidity;

    document.getElementById('temp').innerText = obs.temp.toFixed(1);
    document.getElementById('wind').innerText = Math.round(obs.windSpeed);
    document.getElementById('humidity').innerText = Math.round(humidity);
})
.catch(err => {
    console.error("Error fetching weather data:", err);
    document.getElementById('temp').innerText = "Error";
    document.getElementById('wind').innerText = "Error";
    document.getElementById('humidity').innerText = "Error";
});
}

loadWeather(); // Load immediately
setInterval(loadWeather, 300000); // Refresh every 5 minutes
</script>

</body>
</html>
